[versions]
fabric-loader = "0.19.3"
fabric-loom = "1.17-SNAPSHOT"
fabric-language-kotlin = "1.13.13+kotlin.2.4.10"
minecraft = "1.8.9"
kotlin = "2.4.0"
lwjgl = "3.4.1"
joml = "1.10.8"
yarn = "1.8.9+build.4"
legacy-lwjgl3 = "1.4.1"
devauth = "1.2.2"
fastutil = "7.1.0"
asm = "9.6"
annotations = "24.1.0"
lombok = "1.18.46"
gson = "2.10.1"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin"}
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal", version.ref = "lwjgl" }
lwjgl-sdl = { module = "org.lwjgl:lwjgl-sdl", version.ref = "lwjgl" }
lwjgl-vulkan = { module = "org.lwjgl:lwjgl-vulkan", version.ref = "lwjgl" }
lwjgl-vma = { module = "org.lwjgl:lwjgl-vma", version.ref = "lwjgl" }
lwjgl-shaderc = { module = "org.lwjgl:lwjgl-shaderc", version.ref = "lwjgl" }
joml = { module = "org.joml:joml", version.ref = "joml" }
legacy-yarn = { module = "net.legacyfabric:legacy-yarn", version.ref = "yarn" }
legacy-lwjgl3 = { module = "io.github.moehreag:legacy-lwjgl3", version.ref = "legacy-lwjgl3" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
log4j-core = { module = "org.apache.logging.log4j:log4j-api", version = "2.0-beta9" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
devauth-fabric = { module = "me.djtheredstoner:DevAuth-fabric", version = "1.2.2" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
ploceus = { id = "ploceus", version.ref = "fabric-loom" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
asm = ["asm", "asm-tree", "asm-util"]